# Available wasmer/* packages from the registry:
#   Shells:      wasmer/bash
#   Utilities:   wasmer/coreutils
#   Languages:   wasmer/python, wasmer/php, wasmer/lua
#   Editors:     wasmer/neatvi
#   Media:       wasmer/ffmpeg
#   Web:         wasmer/static-web-server, wasmer/winterjs
#   Data:        wasmer/sqlite
#   Tools:       wasmer/clang, wasmer/qjs (QuickJS)

[package]
name = "wasmer/wasmer-sh"
version = "0.4.21"
description = "The wasmer.sh website"
entrypoint = "wasmer-sh"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "dist"
"/etc/static-web-server" = "etc"

[[command]]
name = "wasmer-sh"
module = "wasmer/static-web-server:webserver"
runner = "wasi"
[command.annotations.wasi]
env = ["SERVER_CONFIG_FILE=/etc/static-web-server/config.toml"]
